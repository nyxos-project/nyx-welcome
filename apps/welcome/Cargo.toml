[package]
name = "nyx-welcome"
description = "Nyx Welcome: NyxOS's setup after installation, reopenable any time"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-catalog = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a1af19d296315e8961d9488dd8c45638f44d598d" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a1af19d296315e8961d9488dd8c45638f44d598d", features = ["client"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
