[package]
name = "nyx-welcome"
description = "Nyx Welcome: NyxOS's setup after installation, reopenable any time"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-catalog = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "93aae604270f5e441fbf963ff1b0e258f5d59b4a" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "93aae604270f5e441fbf963ff1b0e258f5d59b4a" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "93aae604270f5e441fbf963ff1b0e258f5d59b4a", features = ["client"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0b511a6e338f4c2c818bad6ebd351ae406578c00" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "b49ab72631cd6da8dc1bc241078200fcb7a83703" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "b49ab72631cd6da8dc1bc241078200fcb7a83703" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
