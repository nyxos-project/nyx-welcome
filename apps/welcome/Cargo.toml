[package]
name = "nyx-welcome"
description = "Nyx Welcome: NyxOS's setup after installation, reopenable any time"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-catalog = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a69334504fb94abf34659de8fd0705abc4c70889" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a69334504fb94abf34659de8fd0705abc4c70889" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a69334504fb94abf34659de8fd0705abc4c70889", features = ["client"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "394ddf8193797cd1f420fac98b097d04fa75f0e2" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d2398b346b6bc414cc031b0a08a1b2a9a0f6ee2e" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d2398b346b6bc414cc031b0a08a1b2a9a0f6ee2e" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
