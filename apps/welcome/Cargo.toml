[package]
name = "nyx-welcome"
description = "Nyx Welcome: NyxOS's setup after installation, reopenable any time"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-catalog = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "8514a6d9033ff276f9b9a0b6a55dc7ff9eb72d01" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "8514a6d9033ff276f9b9a0b6a55dc7ff9eb72d01" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "8514a6d9033ff276f9b9a0b6a55dc7ff9eb72d01", features = ["client"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
